services:
  db:
    image: postgres:15-alpine
    container_name: bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт 5432 НЕ публікуємо назовні (прибрано "ports"). Боту цей порт
    # доступний і так, всередині docker-мережі, за іменем сервісу "db".
    # Публікація 5432 на сервер з паролем в інтернеті - зайвий ризик:
    # боти-сканери постійно перебирають відкриті 5432 порти.

  bot:
    build: .
    container_name: telegram_bot
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "80:8000"

volumes:
  pgdata: